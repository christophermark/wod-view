# Onboarding walkthrough: hero → import step → back → into sample data →
# banner → import step (from the app) → back into the app.
# (Sample data is the hero's primary CTA; import is the secondary text action.
# Once on sample data, the banner is the import path.)
#
# Dev builds never show onboarding organically (they boot on the bundled
# dataset, on the STATS entry screen), so this reaches it via settings →
# DEV TOOLS → VIEW ONBOARDING FLOW.
# Screenshots land in .maestro/screenshots/ (run via `npm run e2e` from repo root).
appId: com.christophermark.wodview
---
- runFlow: ../subflows/dismiss-open-dialog.yaml
- launchApp:
    clearState: true
# Wait on a string only the in-app STATS screen has. Matching is
# case-insensitive, so 'WOD VIEW' also matches the home-screen app icon and
# passes ~1.5s in, mid-launch — the next tap then hits a hierarchy XCUITest
# can't resolve (kAXErrorInvalidUIElement).
- extendedWaitUntil:
    visible: 'TOTAL WODS'
    timeout: 60000 # first launch waits on Metro bundling + font load
- waitForAnimationToEnd
- tapOn:
    id: 'stats-settings-button'
- assertVisible: 'SETTINGS'
- scrollUntilVisible:
    element:
      text: 'VIEW ONBOARDING FLOW.*'
- tapOn: 'VIEW ONBOARDING FLOW.*'
- assertVisible: 'PERSONAL WOD ARCHIVE'
- assertVisible: 'EXPLORE WITH SAMPLE DATA.*'
- takeScreenshot: .maestro/screenshots/onboarding-01-hero
- tapOn: 'IMPORT YOUR OWN DATA.*'
- assertVisible: 'LOAD YOUR LOG'
- assertVisible: 'No export yet?.*'
- takeScreenshot: .maestro/screenshots/onboarding-02-import
# The settings screen sits under onboarding in the stack and leaks its own
# occluded "‹ BACK" into the a11y hierarchy — the testID disambiguates.
# The settle wait matters: a tap fired straight after takeScreenshot can be
# swallowed.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'onboarding-back'
- assertVisible: 'PERSONAL WOD ARCHIVE'
- tapOn: 'EXPLORE WITH SAMPLE DATA.*'
- extendedWaitUntil:
    visible: 'SAMPLE DATA — IMPORT YOUR OWN.*'
    timeout: 15000
- assertVisible: 'WOD VIEW'
- takeScreenshot: .maestro/screenshots/onboarding-03-sample-data-entered
# The banner is the import path once on sample data: it deep-links to the
# import step, which hides its own sample-data link (already there) and whose
# BACK returns to the app rather than the marketing hero.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'SAMPLE DATA — IMPORT YOUR OWN.*'
- assertVisible: 'LOAD YOUR LOG'
- assertNotVisible: 'No export yet?.*'
- takeScreenshot: .maestro/screenshots/onboarding-04-import-from-banner
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'onboarding-back'
- assertVisible: 'WOD VIEW'
